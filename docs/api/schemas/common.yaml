ObjectId:
  type: string
  pattern: '^[a-f0-9]{24}$'
  example: 6530a1f2c4e5b2a1d3f4e5a6
ClientId:
  type: string
  description: Id generated by the client (for example crypto.randomUUID()), unique inside its list
  pattern: '^[A-Za-z0-9_-]{1,36}$'
  example: 3f6c2a9e-1b7d-4c55-9a51-0d2b8e7f4c10
Username:
  type: string
  description: Letters, numbers and underscore. Cannot be changed after sign-up.
  pattern: '^[A-Za-z0-9_]{3,20}$'
  example: enolaholmes
Email:
  type: string
  format: email
  maxLength: 254
  example: enola@example.com
Password:
  type: string
  format: password
  minLength: 8
  maxLength: 72
  example: storm-chaser-42
HttpUrl:
  type: string
  format: uri
  pattern: '^https?://'
  maxLength: 500
  example: https://enola.games
HexColor:
  type: string
  pattern: '^#[0-9A-Fa-f]{6}$'
  example: '#FF5A1F'
GenreKey:
  type: string
  description: A genre key from GET /meta
  pattern: '^[a-z0-9_]{2,30}$'
  example: survival
Timestamp:
  type: string
  format: date-time
  example: '2026-10-11T08:30:00.000Z'
PageNumber:
  type: integer
  minimum: 1
  example: 1
PageLimit:
  type: integer
  minimum: 1
  maximum: 50
  example: 20
Total:
  type: integer
  minimum: 0
  example: 42
Bullet:
  type: string
  minLength: 1
  maxLength: 120
  example: Breach and clear rooms
Media:
  type: object
  additionalProperties: false
  required: [id, type, url]
  properties:
    id:
      $ref: '#/ObjectId'
    type:
      type: string
      enum: [image, video]
    url:
      type: string
      format: uri
      example: https://media.playloop.example/games/6530a1f2/cover.jpg
