components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: playloop_token
    internalSignature:
      type: apiKey
      in: header
      name: X-PlayLoop-Signature
  schemas:
    Error:
      $ref: schemas/Error.yaml
