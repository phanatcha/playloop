openapi: 3.0.3
info:
  title: PlayLoop API
  version: 0.2.0
  description: |
    REST API for PlayLoop, a reciprocal playtesting platform for indie game developers.
    Summaries reference the requirement IDs (FR-xxx, NFR-xxx) from the kick-off document.

    ## Conventions
    - **Base URL**: `/api`. In production the client reaches it on the same origin through an Amplify rewrite.
    - **Session**: `POST /auth/login` and `POST /auth/register` set an httpOnly `playloop_token` cookie (7 days).
      Send requests with credentials. Logged-out requests to protected endpoints get `401`.
    - **Ownership** is checked on the server for every protected action (NFR-006). Non-owners get `403`.
    - **Errors** always use the `Error` schema: `{ code, message, details? }`. `details` only appears on `VALIDATION_ERROR`.
    - **Lists** take `page` (from 1) and `limit` (max 50) and return `{ items, page, limit, total }`.
    - **Missing values**: optional scalar fields are `null`; optional objects are left out.
    - **Ids** are 24-character hex strings. Form question, option and mission ids are generated by the client.
    - **Uploads** go straight to S3: `POST /uploads` → PUT the file → `POST /uploads/{uploadId}/complete` → use the upload id.
    - **Rate limits** return `429 RATE_LIMITED` (login, sign-up, password reset, replies, reports, uploads, votes, roulette).
    - **Payments** (FR-050, FR-051) are deferred and not in this version.
servers:
  - url: /api
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Service status
  - name: Auth
    description: Sign up, log in, passwords (FR-001)
  - name: Me
    description: The logged-in user's profile and lists (FR-002)
  - name: Notifications
    description: In-app bell
  - name: Users
    description: Public profiles (FR-002)
  - name: Games
    description: Publishing, discovery and builds (FR-010, FR-011)
  - name: Forms
    description: The per-game PlayLoop form with First Impression, Playtest and Final Verdict tabs (FR-012)
  - name: Reviews
    description: The review flow and published reviews (FR-020, FR-021, FR-022)
  - name: Feedback
    description: Developer's Feedback Inbox and feedback status (FR-024)
  - name: Votes
    description: Helpful / not helpful votes (FR-030)
  - name: Discussions
    description: Replies and emoji reactions (FR-023)
  - name: Reputation
    description: Leaderboard (FR-031, FR-032)
  - name: Roulette
    description: Playtest Roulette (FR-040, FR-041)
  - name: Uploads
    description: Direct-to-S3 uploads
  - name: Reports
    description: User reports for moderation
  - name: Meta
    description: Option lists and limits
  - name: Admin
    description: Moderation, users, stats and settings. Admin role only.
  - name: Internal
    description: Called by AWS Lambda, not by the browser
